# Release on a kit-v tag: build and push the kit image, scan it, then sign it.
# Jobs are split so a scanner action never shares a job with a write credential
# or the OIDC token. Never re-run a tag: cut the next patch version.
name: release

on:
  push:
    tags: ['kit-v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/kit-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/sandboxservers/geldar-kit@${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: tag guard (the tagged commit must be on main)
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: validate the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          re='^kit-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?$'
          if ! [[ "$TAG" =~ $re ]]; then
            echo "the tag is not a kit version"
            exit 1
          fi
          echo "VERSION=${TAG#kit-v}" >> "$GITHUB_ENV"
          echo "version=${TAG#kit-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the image tag must not exist
        run: |
          set -u
          if docker buildx imagetools inspect "ghcr.io/sandboxservers/geldar-kit:$VERSION" > /dev/null 2>&1; then
            echo "the image tag $VERSION exists and a re-run would move it: cut the next patch version"
            exit 1
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: image/Dockerfile
          target: kit
          push: true
          tags: ghcr.io/sandboxservers/geldar-kit:${{ env.VERSION }}
          provenance: false
          sbom: false

  scan:
    name: scan
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/kit-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/sandboxservers/geldar-kit@${{ needs.build.outputs.digest }}
          severity: CRITICAL
          exit-code: '1'
          version: v0.76.1
          cache: false
          ignore-unfixed: false
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/sandboxservers/geldar-kit@${{ needs.build.outputs.digest }}
          fail-build: true
          severity-cutoff: critical
          grype-version: v0.121.0
          only-fixed: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/sandboxservers/geldar-kit@${{ needs.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-sbom
          path: sbom.spdx.json
          retention-days: 30
          if-no-files-found: error

  sign:
    name: sign
    needs: [build, scan]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/kit-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-sbom
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: sign the image by digest
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE"
      - name: verify the signature
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE" \
            --certificate-identity-regexp '^https://github\.com/SandboxServers/geldar-scriptorium/\.github/workflows/release\.yml@refs/tags/kit-v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: attest the SBOM
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"
      - name: the package must be public
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -u
          fail() {
            echo "the kit package is private: an org admin must make it public (D-SC-06), then cut the next patch tag"
            exit 1
          }
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:sandboxservers/geldar-kit:pull" | jq -r .token) || fail
          [ -n "$token" ] && [ "$token" != "null" ] || fail
          curl -fsS -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/sandboxservers/geldar-kit/manifests/$DIGEST" || fail
