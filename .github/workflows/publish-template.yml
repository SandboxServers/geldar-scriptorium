name: publish-template

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      image:
        type: string
        required: true
      source-sha:
        type: string
        required: true
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-template-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version || 'kit-v0.0.0-dryrun' }}
      SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag guard
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Assemble (dry run)
        run: node tools/release/src/publish-template.ts --dry-run --version "$VERSION" --source-sha "$SOURCE_SHA"

  publish:
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/kit-v') && github.repository == 'SandboxServers/geldar-scriptorium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ${{ inputs.image }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag guard
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read the bot credentials from Key Vault
        id: keyvault
        env:
          KV: ${{ vars.KEY_VAULT_NAME }}
        run: |
          set +x
          set -euo pipefail
          app_id="$(az keyvault secret show --vault-name "$KV" --name geldar-bot-app-id --query value --output tsv)"
          echo "::add-mask::$app_id"
          private_key="$(az keyvault secret show --vault-name "$KV" --name geldar-bot-private-key --query value --output tsv)"
          while IFS= read -r l; do [ -n "$l" ] && echo "::add-mask::$l"; done <<< "$private_key"
          echo "::add-mask::$private_key"
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "app-id=$app_id"
            echo "private-key<<$delim"
            echo "$private_key"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
      - name: Installation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.keyvault.outputs.app-id }}
          private-key: ${{ steps.keyvault.outputs.private-key }}
          owner: SandboxServers
          repositories: geldar-player-template
          permission-contents: write
          permission-metadata: read
      - name: Azure logout
        if: always()
        run: az logout || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Publish
        env:
          GELDAR_PUBLISH_TOKEN: ${{ steps.app.outputs.token }}
        run: node tools/release/src/publish-template.ts --version "$VERSION" --source-sha "$SOURCE_SHA" --image "$IMAGE"
