# Builds the kit image without pushing it and scans it with trivy and grype.
# It holds read access to the repository contents and nothing else.
name: image-scan

on:
  pull_request:
    paths:
      - image/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/image-scan.yml
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image/Dockerfile
          target: kit
          push: false
          load: true
          tags: geldar-kit:scan
          provenance: false
          sbom: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: geldar-kit:scan
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          version: v0.76.1
          cache: false
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: geldar-kit:scan
          fail-build: true
          severity-cutoff: critical
          only-fixed: false
          grype-version: v0.121.0
