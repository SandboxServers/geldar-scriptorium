# The real world's address and the shards whose player repositories must be private.
# Read as data (key=value), never sourced.
# OWNER INPUT REQUIRED: the values are blank until the owner sets them (SC-72).
# mcp_base: scheme and host only, for example https://world.example (no path, no credentials).
mcp_base=
# mcp_port: owner-set port of the world's MCP, digits only, no leading zero, 1024 to 65535.
# Blank means only 80 and 443 are ever accepted. mcp_base carries the same port, for example
# https://world.example:18443.
mcp_port=
# private_only_shards: shard names separated by commas.
private_only_shards=
