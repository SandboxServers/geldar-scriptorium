# The real world's address and the shards whose player repositories must be private.
# Read as data (key=value), never sourced.
# mcp_base: scheme, host and the world's port, no path and no credentials. The port is written
# when it is not 443; new builds each player's mcp_url as this base plus /p/<player_id>.
mcp_base=https://geldar.sandboxservers.games:18443
# mcp_port: owner-set port of the world's MCP, digits only, no leading zero, 1024 to 65535.
# Blank means only 80 and 443 are ever accepted. mcp_base carries the same port, for example
# https://world.example:18443.
mcp_port=18443
# private_only_shards: shard names separated by commas. Blank for now: all shards are currently
# watched, and the list is revisited later.
private_only_shards=
