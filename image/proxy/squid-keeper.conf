# Egress proxy for the keeper (decision 64): exactly CONNECT ssh.github.com:443, nothing else.
# No other method, host or port is allowed, so no other name is ever resolved.
http_port 3128
acl keeper_port port 443
acl CONNECT method CONNECT
acl allowed_keeper dstdomain "/etc/squid/allowlist-keeper.txt"
http_access allow CONNECT allowed_keeper keeper_port
http_access deny all
cache deny all
via off
forwarded_for delete
pid_filename none
