# Egress allowlist proxy for the session container (D-SC-04).
http_port 3128
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl port_80 port 80
acl world_port port "/etc/squid/allowlist-world-ports.txt"
acl CONNECT method CONNECT
acl allowed_vendor dstdomain "/etc/squid/allowlist-vendor.txt"
acl allowed_world dstdomain "/etc/squid/allowlist-world.txt"
http_access deny !Safe_ports !world_port
http_access deny CONNECT port_80
http_access deny CONNECT !SSL_ports !world_port
http_access allow allowed_vendor Safe_ports
http_access allow allowed_world world_port
http_access deny all
cache deny all
via off
forwarded_for delete
pid_filename none
